[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmpbsa"
version = "0.7.0"
description = "Fixed-semantics, replica-addressable MMPBSA workflow framework"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
parmed = ["ParmEd>=4.3,<5", "numpy>=1.24,<3"]
preparation = ["ParmEd>=4.3,<5", "numpy>=1.24,<3", "gemmi>=0.7,<1"]
trajectory = ["mdtraj>=1.11,<2", "ParmEd>=4.3,<5"]
openmm = ["OpenMM>=8.5.1,<8.6", "mdtraj>=1.11,<2", "ParmEd>=4.3,<5"]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
mmpbsa = "mmpbsa.core.cli:main"

[project.entry-points."mmpbsa.providers.v2"]
builtin = "mmpbsa.backends.provider:get_provider"
openmm = "mmpbsa.backends.openmm_provider:get_provider"
report = "mmpbsa.report.provider:get_provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mmpbsa.*"]
namespaces = true

[tool.setuptools.package-data]
"mmpbsa.utils" = ["py.typed"]
"mmpbsa.core" = ["py.typed"]
"mmpbsa.backends" = ["py.typed"]
"mmpbsa.report" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "validations",
]
pythonpath = [
  "src",
]
norecursedirs = [
  "validations/tyk2_3x5ns_tmp*",
  "_runs",
  "prepared",
  "build",
  "dist",
  "*.egg-info",
  "_workspace",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "validations/tyk2_3x5ns_tmp*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
