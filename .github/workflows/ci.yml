name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - if: matrix.python-version == '3.12'
        run: python scripts/release_check.py --skip-tests

  openmm-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MMPBSA_OPENMM_SMOKE: "1"
      OPENMM_CPU_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,openmm]'
      - run: python -m pytest -q tests/backends/test_openmm_backend.py tests/backends/test_trajectory_v3.py
